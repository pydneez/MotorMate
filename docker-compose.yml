# Local development database only — the apps themselves run with `npm run dev:*` (see
# README). Settings come from the root .env (copy .env.example).
#
# Ports are published on 127.0.0.1 only, so the local dev passwords can't be reached from
# other machines on the same network.
services:
  postgres:
    # Same major version as RDS on AWS.
    image: postgres:16-alpine
    container_name: motormate-postgres
    restart: unless-stopped
    ports:
      # Host port 5433 -> container 5432, so it doesn't clash with a natively installed
      # PostgreSQL on 5432; the container always listens on 5432 internally.
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - motormate_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional GUI for browsing the database at http://localhost:5050 — comment out if you
  # prefer `npm run db:studio` instead.
  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: motormate-pgadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - motormate_pgadmin_data:/var/lib/pgadmin

volumes:
  motormate_pg_data:
  motormate_pgadmin_data:
