AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  MotorMate database: RDS PostgreSQL in the isolated subnets of motormate-base.
  Deployed by infra/scripts/up.sh as stack "motormate-db"; the dev account deletes it
  nightly (down.sh) and up.sh re-seeds it.

Parameters:
  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    AllowedPattern: "[a-zA-Z0-9]+"
    ConstraintDescription: letters and digits only (it is embedded in DATABASE_URL)
  MultiAZ:
    Type: String
    AllowedValues: ["false", "true"]
    Default: "false"
    Description: true in the demo account (primary + standby), false in dev
  InstanceClass:
    Type: String
    Default: db.t3.micro
  MigrateImage:
    Type: String
    Description: full ECR URI of the migrate image (backend/Dockerfile --target migrate)
  Mode:
    Type: String
    AllowedValues: [learner-lab, full]
    Default: learner-lab
    Description: full mode keeps DATABASE_URL in Secrets Manager (see app.yml)

Conditions:
  Full: !Equals [!Ref Mode, full]

Resources:
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: MotorMate isolated database subnets
      SubnetIds: !Split [",", !ImportValue motormate-DbSubnets]

  Database:
    Type: AWS::RDS::DBInstance
    # Dev data is only seed data, so no final snapshot when the stack is deleted.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: motormate
      Engine: postgres
      EngineVersion: "16"
      DBInstanceClass: !Ref InstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: !Ref MultiAZ
      DBName: motormate
      MasterUsername: motormate
      MasterUserPassword: !Ref DbPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!ImportValue motormate-DbSecurityGroup]
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeleteAutomatedBackups: true
      DeletionProtection: false
      AutoMinorVersionUpgrade: true

  # Full mode: the migration task's DATABASE_URL. The app stack has its own secret, but it
  # doesn't exist yet when the first migration runs. Named after this stack's id, because a
  # deleted secret keeps its name for 7 days.
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Condition: Full
    Properties:
      Name: !Sub
        - motormate/db-${StackUuid}
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      Description: MotorMate DATABASE_URL for the migration task
      SecretString: !Sub '{"DATABASE_URL":"postgresql://motormate:${DbPassword}@${Database.Endpoint.Address}:5432/motormate?schema=public"}'

  # `prisma migrate deploy` as a one-off task (infra/scripts/migrate.sh), run before each
  # rollout so new API containers never start against an old schema. Roles from
  # motormate-base (LabRole in Learner Lab).
  MigrateTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: motormate-migrate
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !ImportValue motormate-ExecutionRoleArn
      TaskRoleArn: !ImportValue motormate-NoPermissionsTaskRoleArn
      ContainerDefinitions:
        - Name: migrate
          Image: !Ref MigrateImage
          Essential: true
          Environment: !If
            - Full
            - !Ref AWS::NoValue
            - - Name: DATABASE_URL
                Value: !Sub "postgresql://motormate:${DbPassword}@${Database.Endpoint.Address}:5432/motormate?schema=public"
          Secrets: !If
            - Full
            - - { Name: DATABASE_URL, ValueFrom: !Sub "${DbSecret}:DATABASE_URL::" }
            - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /motormate/backend
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: migrate

Outputs:
  DbHost:
    Value: !GetAtt Database.Endpoint.Address
    Export: { Name: motormate-DbHost }
