AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  MotorMate base: VPC, subnets, security groups, ECR repositories and log groups.
  Kept between work sessions (none of it costs anything while idle). Deployed by
  infra/scripts/up.sh as stack "motormate-base".

# Public subnets hold the load balancer and the ECS tasks (with public IPs, so they can
# pull from ECR without a NAT Gateway, ~$32/month). Isolated subnets have no internet
# route at all and hold only the database.
#
# One least-privilege IAM role per job; their ARNs are exported for the db and app stacks.

Parameters:
  DeployerArn:
    Type: String
    Default: ""
    Description: the IAM user/role running the scripts (may empty the invoice bucket)

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: motormate }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: motormate }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: motormate-public-a }]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: motormate-public-b }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: motormate-public }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  DbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: motormate-db-a }]

  DbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: motormate-db-b }]

  # No routes besides the VPC's own: the database subnets can't reach or be reached from
  # the internet.
  DbRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: motormate-db }]

  DbSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DbSubnetA
      RouteTableId: !Ref DbRouteTable

  DbSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DbSubnetB
      RouteTableId: !Ref DbRouteTable

  # ── Security groups: internet → ALB → app containers → database ─────────────
  # Its inbound rule lives in the app stack: only CloudFront's addresses.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MotorMate load balancer - inbound rule set by the app stack
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: motormate-alb }]

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MotorMate backend tasks - from the load balancer and the frontend
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSecurityGroup }
        # The frontend server's own API calls over private DNS (see app stack).
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref FrontendSecurityGroup }
      Tags: [{ Key: Name, Value: motormate-backend }]

  FrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MotorMate frontend tasks - only from the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 3000, ToPort: 3000, SourceSecurityGroupId: !Ref AlbSecurityGroup }
      Tags: [{ Key: Name, Value: motormate-frontend }]

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MotorMate database - only from the backend tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref BackendSecurityGroup }
      Tags: [{ Key: Name, Value: motormate-db }]

  # ── Images and logs ───────────────────────────────────────────────────────────
  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: motormate-backend
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep the last 10 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
          "action":{"type":"expire"}}]}

  FrontendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: motormate-frontend
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep the last 10 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
          "action":{"type":"expire"}}]}

  # Prisma CLI + migrations only; run as a one-off task by migrate.sh before each rollout.
  MigrateRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: motormate-migrate
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep the last 10 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
          "action":{"type":"expire"}}]}

  # Lives here rather than in the app stack so the migration task can run before the app
  # stack rolls out new containers. An empty cluster costs nothing.
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: motormate

  # ── Invoice PDFs ─────────────────────────────────────────────────────────────
  # Private and encrypted; the API stores each invoice's PDF here on its first download and
  # hands out 5-minute presigned links. Kept between sessions (pennies). nuke.sh empties it
  # before deleting the stack — CloudFormation can't delete a bucket that has objects.
  InvoiceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub motormate-invoices-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  # HTTPS only, and only two principals at all: the backend's role (presigned links are
  # signed with it too) and whoever runs the scripts, so they can empty and delete it.
  InvoiceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref InvoiceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt InvoiceBucket.Arn, !Sub "${InvoiceBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }
          - Sid: AppAndDeployerOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt InvoiceBucket.Arn, !Sub "${InvoiceBucket.Arn}/*"]
            Condition:
              ArnNotLike:
                "aws:PrincipalArn": [!GetAtt BackendTaskRole.Arn, !Ref DeployerArn]

  # ── Customer emails ──────────────────────────────────────────────────────────
  # SES is sandbox-only in this account, so emails go through SNS: each customer with an email gets
  # one subscription to this topic, filtered on their id (the API subscribes them; they
  # confirm once from AWS's email). Kept between sessions so confirmations survive.
  NotifyTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: motormate-notifications
      DisplayName: MotorMate

  # ── Roles ────────────────────────────────────────────────────────────────────
  # Pulls images, writes logs and reads our secrets (motormate/*) when a task starts.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: MotorMate ECS execution role - images, logs, motormate/* secrets
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-motormate-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:motormate/*

  # What the API itself calls: invoice PDFs in our bucket and customer emails on our topic.
  BackendTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: MotorMate API - invoice PDFs and customer emails only
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }
      Policies:
        - PolicyName: invoices-and-emails
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${InvoiceBucket.Arn}/invoices/*
              # So a missing PDF is a 404 (regenerate it), not a 403.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt InvoiceBucket.Arn
                Condition: { StringLike: { "s3:prefix": "invoices/*" } }
              - Effect: Allow
                Action:
                  - sns:Publish
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:ListSubscriptionsByTopic
                  - sns:GetSubscriptionAttributes
                  - sns:SetSubscriptionAttributes
                Resource: !Ref NotifyTopic

  # The frontend and the migration task call no AWS APIs at all.
  NoPermissionsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: MotorMate tasks that call no AWS APIs (frontend, migrations)
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }

  # The daily-jobs Lambda: its own logs and the job-token secret.
  JobsFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: MotorMate daily-jobs Lambda - logs and the job token
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-motormate-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:motormate/*

  # EventBridge Scheduler may start that one function, nothing else.
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: MotorMate schedules - invoke the daily-jobs Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId } }
      Policies:
        - PolicyName: invoke-daily-jobs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:motormate-daily-jobs

  # The daily-jobs Lambda's logs (Lambda writes to /aws/lambda/<function name>).
  JobsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/motormate-daily-jobs
      RetentionInDays: 14

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /motormate/backend
      RetentionInDays: 14

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /motormate/frontend
      RetentionInDays: 14

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: motormate-VpcId }
  PublicSubnets:
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
    Export: { Name: motormate-PublicSubnets }
  DbSubnets:
    Value: !Join [",", [!Ref DbSubnetA, !Ref DbSubnetB]]
    Export: { Name: motormate-DbSubnets }
  AlbSecurityGroup:
    Value: !Ref AlbSecurityGroup
    Export: { Name: motormate-AlbSecurityGroup }
  BackendSecurityGroup:
    Value: !Ref BackendSecurityGroup
    Export: { Name: motormate-BackendSecurityGroup }
  FrontendSecurityGroup:
    Value: !Ref FrontendSecurityGroup
    Export: { Name: motormate-FrontendSecurityGroup }
  DbSecurityGroup:
    Value: !Ref DbSecurityGroup
    Export: { Name: motormate-DbSecurityGroup }
  Cluster:
    Value: !Ref Cluster
    Export: { Name: motormate-Cluster }
  InvoiceBucket:
    Value: !Ref InvoiceBucket
    Export: { Name: motormate-InvoiceBucket }
  NotifyTopic:
    Value: !Ref NotifyTopic
    Export: { Name: motormate-NotifyTopic }
  # Roles
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
    Export: { Name: motormate-ExecutionRoleArn }
  BackendTaskRoleArn:
    Value: !GetAtt BackendTaskRole.Arn
    Export: { Name: motormate-BackendTaskRoleArn }
  NoPermissionsTaskRoleArn:
    Value: !GetAtt NoPermissionsTaskRole.Arn
    Export: { Name: motormate-NoPermissionsTaskRoleArn }
  JobsFunctionRoleArn:
    Value: !GetAtt JobsFunctionRole.Arn
    Export: { Name: motormate-JobsFunctionRoleArn }
  SchedulerRoleArn:
    Value: !GetAtt SchedulerRole.Arn
    Export: { Name: motormate-SchedulerRoleArn }
  BackendRepositoryUri:
    Value: !GetAtt BackendRepository.RepositoryUri
  FrontendRepositoryUri:
    Value: !GetAtt FrontendRepository.RepositoryUri
