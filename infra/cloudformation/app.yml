AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  MotorMate app: load balancer, ECS Fargate services for the backend and frontend
  containers, and the HTTPS front door (CloudFront in full mode, an API Gateway HTTP API in
  Learner Lab). Deployed by infra/scripts/up.sh as stack "motormate-app"; the dev account
  deletes it nightly (down.sh).

# Full mode (demo account):
#   Browser ──HTTPS──▶ CloudFront (https://<id>.cloudfront.net)
#                          │ /_next/static/* cached; everything else passed through,
#                          │ with the secret X-Origin-Verify header added
#                          ▼
#                    ALB :80 (CloudFront's addresses only; no secret header → 403)
#                          ├── /v1, /v1/* ──▶ backend service  (NestJS :8080)
#                          └── everything else ──▶ frontend service (Next.js :3000)
#   The frontend server calls the backend directly: http://backend.motormate.local:8080/v1
#   (Cloud Map private DNS), since the ALB only answers CloudFront.
#   App secrets come from Secrets Manager (motormate/app-…), not environment variables.
#
# Learner Lab mode (dev account; CloudFront is denied there):
#   Browser ──HTTPS──▶ API Gateway (https://<id>.execute-api.<region>.amazonaws.com)
#                          │ every path, proxied
#                          ▼
#                    ALB :80 (from anywhere) ── same two routes as above
#
#   Both: EventBridge Scheduler (09:00, 18:30 Bangkok) ──▶ Lambda ──HTTPS──▶ POST /v1/jobs/<job>

Parameters:
  Mode:
    Type: String
    AllowedValues: [learner-lab, full]
    Default: learner-lab
  BackendImage:
    Type: String
    Description: full ECR image URI with tag
  FrontendImage:
    Type: String
    Description: full ECR image URI with tag
  DbPassword:
    Type: String
    NoEcho: true
  JwtSecret:
    Type: String
    NoEcho: true
  NextAuthSecret:
    Type: String
    NoEcho: true
  JobToken:
    Type: String
    NoEcho: true
    Description: shared secret the daily-jobs Lambda sends to POST /v1/jobs/<job>
  OriginSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: full mode - header value CloudFront adds and the ALB requires
  CloudFrontPrefixListId:
    Type: String
    Default: ""
    Description: full mode - id of com.amazonaws.global.cloudfront.origin-facing (up.sh looks it up)
  BackendCount:
    Type: Number
    Default: 2
    Description: at least 2, so the API survives one container failing
  FrontendCount:
    Type: Number
    Default: 1
    Description: 2 in the demo account, so the site survives losing a container or an AZ

Conditions:
  Full: !Equals [!Ref Mode, full]
  LearnerLab: !Not [!Condition Full]

Resources:
  # ── Load balancer ─────────────────────────────────────────────────────────────
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: motormate
      Scheme: internet-facing
      Type: application
      Subnets: !Split [",", !ImportValue motormate-PublicSubnets]
      SecurityGroups: [!ImportValue motormate-AlbSecurityGroup]

  # API Gateway has no fixed addresses, so Learner Lab opens port 80 to anywhere.
  AlbIngressAnywhere:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: LearnerLab
    Properties:
      GroupId: !ImportValue motormate-AlbSecurityGroup
      Description: HTTP from anywhere (API Gateway)
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0

  # Full mode: only CloudFront's origin-facing addresses (an AWS-managed prefix list).
  AlbIngressCloudFront:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: Full
    Properties:
      GroupId: !ImportValue motormate-AlbSecurityGroup
      Description: HTTP from CloudFront only
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourcePrefixListId: !Ref CloudFrontPrefixListId

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: motormate-backend
      VpcId: !ImportValue motormate-VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /v1
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "15" }

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: motormate-frontend
      VpcId: !ImportValue motormate-VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      HealthCheckPath: /login
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "15" }

  # Full mode: anything without CloudFront's secret header gets a 403 — even from an address
  # in CloudFront's range (someone else's distribution), the request never reaches the app.
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions: !If
        - Full
        - - Type: fixed-response
            FixedResponseConfig: { StatusCode: "403", ContentType: text/plain, MessageBody: Forbidden }
        - - { Type: forward, TargetGroupArn: !Ref FrontendTargetGroup }

  BackendRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 10
      Conditions: !If
        - Full
        - - Field: path-pattern
            PathPatternConfig: { Values: ["/v1", "/v1/*"] }
          - Field: http-header
            HttpHeaderConfig: { HttpHeaderName: X-Origin-Verify, Values: [!Ref OriginSecret] }
        - - Field: path-pattern
            PathPatternConfig: { Values: ["/v1", "/v1/*"] }
      Actions:
        - { Type: forward, TargetGroupArn: !Ref BackendTargetGroup }

  # Full mode only: in Learner Lab the frontend is the listener's default action.
  FrontendRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: Full
    Properties:
      ListenerArn: !Ref Listener
      Priority: 20
      Conditions:
        - Field: http-header
          HttpHeaderConfig: { HttpHeaderName: X-Origin-Verify, Values: [!Ref OriginSecret] }
      Actions:
        - { Type: forward, TargetGroupArn: !Ref FrontendTargetGroup }

  # ── HTTPS front door: CloudFront (full mode) ─────────────────────────────────
  # The default *.cloudfront.net certificate gives HTTPS without a domain. Caching only for
  # Next.js's build assets (their names change with every build); pages and the API are
  # passed through with every header, cookie and query string (AWS-managed policies).
  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: Full
    Properties:
      DistributionConfig:
        Comment: MotorMate
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        # 200 includes Asia, where the shop and its customers are.
        PriceClass: PriceClass_200
        Origins:
          - Id: alb
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 30
            OriginCustomHeaders:
              - { HeaderName: X-Origin-Verify, HeaderValue: !Ref OriginSecret }
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer
        CacheBehaviors:
          - PathPattern: /_next/static/*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized

  # ── HTTPS front door: API Gateway (Learner Lab) ──────────────────────────────
  # CloudFront is denied in Learner Lab; an HTTP API's default endpoint has an AWS
  # certificate. Two routes because "/" doesn't match "/{proxy+}".
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Condition: LearnerLab
    Properties:
      Name: motormate
      ProtocolType: HTTP

  ProxyIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: LearnerLab
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub "http://${LoadBalancer.DNSName}/{proxy}"
      PayloadFormatVersion: "1.0"

  RootIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: LearnerLab
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub "http://${LoadBalancer.DNSName}/"
      PayloadFormatVersion: "1.0"

  ProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: LearnerLab
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /{proxy+}
      Target: !Sub integrations/${ProxyIntegration}

  RootRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: LearnerLab
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /
      Target: !Sub integrations/${RootIntegration}

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Condition: LearnerLab
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  # ── Private DNS for the frontend server's API calls (full mode) ──────────────
  # backend.motormate.local resolves to the backend tasks' private IPs (one A record each).
  Namespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Condition: Full
    Properties:
      Name: motormate.local
      Vpc: !ImportValue motormate-VpcId

  BackendDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Condition: Full
    Properties:
      Name: backend
      NamespaceId: !Ref Namespace
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords: [{ Type: A, TTL: 10 }]
      HealthCheckCustomConfig: { FailureThreshold: 1 }

  # ── App secrets (full mode) ──────────────────────────────────────────────────
  # One JSON secret; the task definitions pick their keys (Secrets: valueFrom), so the
  # values never appear in the task definitions or the console. The name ends with this
  # stack's id: a deleted secret keeps its name for 7 days, which would block a re-deploy.
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Condition: Full
    Properties:
      Name: !Sub
        - motormate/app-${StackUuid}
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      Description: MotorMate API and frontend secrets
      SecretString: !Sub
        - '{"DATABASE_URL":"postgresql://motormate:${DbPassword}@${DbHost}:5432/motormate?schema=public","JWT_SECRET":"${JwtSecret}","NEXTAUTH_SECRET":"${NextAuthSecret}","JOB_TOKEN":"${JobToken}"}'
        - DbHost: !ImportValue motormate-DbHost

  # ── Containers (the ECS cluster itself is in motormate-base) ────────────────────
  # Roles come from motormate-base: our own least-privilege roles in full mode, LabRole in
  # Learner Lab.
  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: motormate-backend
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !ImportValue motormate-ExecutionRoleArn
      TaskRoleArn: !ImportValue motormate-BackendTaskRoleArn
      ContainerDefinitions:
        - Name: backend
          Image: !Ref BackendImage
          Essential: true
          PortMappings: [{ ContainerPort: 8080 }]
          Environment:
            - !If
              - Full
              - !Ref AWS::NoValue
              - Name: DATABASE_URL
                Value: !Sub
                  - "postgresql://motormate:${DbPassword}@${DbHost}:5432/motormate?schema=public"
                  - DbHost: !ImportValue motormate-DbHost
            # RDS requires SSL; the image carries AWS's RDS certificate bundle.
            - { Name: DATABASE_SSL_CA, Value: /app/rds-global-bundle.pem }
            - !If [Full, !Ref AWS::NoValue, { Name: JWT_SECRET, Value: !Ref JwtSecret }]
            - !If [Full, !Ref AWS::NoValue, { Name: JOB_TOKEN, Value: !Ref JobToken }]
            - { Name: INVOICE_BUCKET, Value: !ImportValue motormate-InvoiceBucket }
            - Name: CORS_ORIGIN
              Value: !If [Full, !Sub "https://${Distribution.DomainName}", !GetAtt HttpApi.ApiEndpoint]
            - { Name: NOTIFY_TOPIC_ARN, Value: !ImportValue motormate-NotifyTopic }
          Secrets: !If
            - Full
            - - { Name: DATABASE_URL, ValueFrom: !Sub "${AppSecret}:DATABASE_URL::" }
              - { Name: JWT_SECRET, ValueFrom: !Sub "${AppSecret}:JWT_SECRET::" }
              - { Name: JOB_TOKEN, ValueFrom: !Sub "${AppSecret}:JOB_TOKEN::" }
            - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /motormate/backend
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: motormate-frontend
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !ImportValue motormate-ExecutionRoleArn
      TaskRoleArn: !ImportValue motormate-NoPermissionsTaskRoleArn
      ContainerDefinitions:
        - Name: frontend
          Image: !Ref FrontendImage
          Essential: true
          PortMappings: [{ ContainerPort: 3000 }]
          Environment:
            - Name: NEXTAUTH_URL
              Value: !If [Full, !Sub "https://${Distribution.DomainName}", !GetAtt HttpApi.ApiEndpoint]
            - !If [Full, !Ref AWS::NoValue, { Name: NEXTAUTH_SECRET, Value: !Ref NextAuthSecret }]
            # The Next.js server's own API calls: straight to the backend tasks in full mode
            # (the ALB only answers CloudFront), through the ALB in Learner Lab.
            - Name: API_INTERNAL_URL
              Value: !If
                - Full
                - http://backend.motormate.local:8080/v1
                - !Sub "http://${LoadBalancer.DNSName}/v1"
          Secrets: !If
            - Full
            - - { Name: NEXTAUTH_SECRET, ValueFrom: !Sub "${AppSecret}:NEXTAUTH_SECRET::" }
            - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /motormate/frontend
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend

  # Fargate spreads each service's tasks over the subnets it's given — one per AZ.
  BackendService:
    Type: AWS::ECS::Service
    DependsOn: BackendRule
    Properties:
      ServiceName: backend
      Cluster: !ImportValue motormate-Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref BackendTaskDefinition
      DesiredCount: !Ref BackendCount
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [",", !ImportValue motormate-PublicSubnets]
          SecurityGroups: [!ImportValue motormate-BackendSecurityGroup]
      LoadBalancers:
        - { ContainerName: backend, ContainerPort: 8080, TargetGroupArn: !Ref BackendTargetGroup }
      ServiceRegistries: !If
        - Full
        - [{ RegistryArn: !GetAtt BackendDiscovery.Arn }]
        - !Ref AWS::NoValue

  FrontendService:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: frontend
      Cluster: !ImportValue motormate-Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref FrontendTaskDefinition
      DesiredCount: !Ref FrontendCount
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [",", !ImportValue motormate-PublicSubnets]
          SecurityGroups: [!ImportValue motormate-FrontendSecurityGroup]
      LoadBalancers:
        - { ContainerName: frontend, ContainerPort: 3000, TargetGroupArn: !Ref FrontendTargetGroup }

  # ── Daily jobs ───────────────────────────────────────────────────────────────
  # The jobs live in the API (POST /v1/jobs/morning and /v1/jobs/close-day); this Lambda only
  # calls them with the job token, and fails on an error status so Scheduler retries. In full
  # mode it reads the token from Secrets Manager (once per container) instead of its env.
  JobsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: motormate-daily-jobs
      Description: Calls MotorMate's daily jobs (service reminders, closing the shop day)
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !ImportValue motormate-JobsFunctionRoleArn
      Timeout: 60
      MemorySize: 128
      Environment:
        Variables: !If
          - Full
          - JOBS_URL: !Sub "https://${Distribution.DomainName}/v1/jobs"
            JOB_TOKEN_SECRET: !Ref AppSecret
          - JOBS_URL: !Sub "${HttpApi.ApiEndpoint}/v1/jobs"
            JOB_TOKEN: !Ref JobToken
      Code:
        ZipFile: |
          const { SecretsManagerClient, GetSecretValueCommand } = require("@aws-sdk/client-secrets-manager");
          let token = process.env.JOB_TOKEN;
          async function jobToken() {
            if (!token) {
              const secret = await new SecretsManagerClient({}).send(
                new GetSecretValueCommand({ SecretId: process.env.JOB_TOKEN_SECRET }),
              );
              token = JSON.parse(secret.SecretString).JOB_TOKEN;
            }
            return token;
          }
          exports.handler = async (event) => {
            const job = event && event.job;
            if (job !== "morning" && job !== "close-day") throw new Error("Unknown job: " + JSON.stringify(event));
            const response = await fetch(process.env.JOBS_URL + "/" + job, {
              method: "POST",
              headers: { "x-job-token": await jobToken() },
              signal: AbortSignal.timeout(29000),
            });
            const body = await response.text();
            console.log(job, response.status, body);
            if (!response.ok) throw new Error(job + " failed with " + response.status);
            return JSON.parse(body);
          };

  # Every day, in Bangkok time. The jobs only act on shop days, so Sundays are harmless.
  MorningSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: motormate-morning
      Description: Service reminder emails and tomorrow's appointment reminders
      ScheduleExpression: cron(0 9 * * ? *)
      ScheduleExpressionTimezone: Asia/Bangkok
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt JobsFunction.Arn
        RoleArn: !ImportValue motormate-SchedulerRoleArn
        Input: '{"job":"morning"}'
        RetryPolicy: { MaximumRetryAttempts: 2 }

  CloseDaySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: motormate-close-day
      Description: Marks the day's no-shows and cancels requests that were never confirmed
      ScheduleExpression: cron(30 18 * * ? *)
      ScheduleExpressionTimezone: Asia/Bangkok
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt JobsFunction.Arn
        RoleArn: !ImportValue motormate-SchedulerRoleArn
        Input: '{"job":"close-day"}'
        RetryPolicy: { MaximumRetryAttempts: 2 }

Outputs:
  SiteUrl:
    Description: the HTTPS address of the whole site
    Value: !If [Full, !Sub "https://${Distribution.DomainName}", !GetAtt HttpApi.ApiEndpoint]
  LoadBalancerUrl:
    Description: plain HTTP straight to the load balancer (answers 403 in full mode)
    Value: !Sub "http://${LoadBalancer.DNSName}"
  Mode:
    Value: !Ref Mode
  DistributionId:
    Condition: Full
    Value: !Ref Distribution
  ClusterName:
    Value: !ImportValue motormate-Cluster
