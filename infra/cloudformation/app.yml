AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  MotorMate app: load balancer, ECS Fargate services for the backend and frontend
  containers, and an API Gateway HTTP API that gives the whole site HTTPS. Deployed by
  infra/scripts/up.sh as stack "motormate-app" and deleted nightly by down.sh.

#   Browser ──HTTPS──▶ API Gateway (https://<id>.execute-api.<region>.amazonaws.com)
#                          │ every path, proxied
#                          ▼
#                    ALB :80 ── /v1, /v1/* ──▶ backend service  (NestJS :8080)
#                           └── everything else ──▶ frontend service (Next.js :3000)
#
#   EventBridge Scheduler (09:00, 18:30 Bangkok) ──▶ Lambda ──HTTPS──▶ POST /v1/jobs/<job>

Parameters:
  BackendImage:
    Type: String
    Description: full ECR image URI with tag
  FrontendImage:
    Type: String
    Description: full ECR image URI with tag
  LabRoleArn:
    Type: String
    Description: Learner Lab's pre-made LabRole (no other roles can be created)
  DbPassword:
    Type: String
    NoEcho: true
  JwtSecret:
    Type: String
    NoEcho: true
  NextAuthSecret:
    Type: String
    NoEcho: true
  JobToken:
    Type: String
    NoEcho: true
    Description: shared secret the daily-jobs Lambda sends to POST /v1/jobs/<job>
  BackendCount:
    Type: Number
    Default: 2
    Description: at least 2, so the API survives one container failing
  FrontendCount:
    Type: Number
    Default: 1

Resources:
  # ── Load balancer ─────────────────────────────────────────────────────────────
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: motormate
      Scheme: internet-facing
      Type: application
      Subnets: !Split [",", !ImportValue motormate-PublicSubnets]
      SecurityGroups: [!ImportValue motormate-AlbSecurityGroup]

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: motormate-backend
      VpcId: !ImportValue motormate-VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /v1
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "15" }

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: motormate-frontend
      VpcId: !ImportValue motormate-VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      HealthCheckPath: /login
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "15" }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - { Type: forward, TargetGroupArn: !Ref FrontendTargetGroup }

  BackendRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig: { Values: ["/v1", "/v1/*"] }
      Actions:
        - { Type: forward, TargetGroupArn: !Ref BackendTargetGroup }

  # ── HTTPS in front of the load balancer ─────────────────────────────────────
  # CloudFront is denied in Learner Lab; an HTTP API's default endpoint has an AWS
  # certificate. Two routes because "/" doesn't match "/{proxy+}".
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: motormate
      ProtocolType: HTTP

  ProxyIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub "http://${LoadBalancer.DNSName}/{proxy}"
      PayloadFormatVersion: "1.0"

  RootIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub "http://${LoadBalancer.DNSName}/"
      PayloadFormatVersion: "1.0"

  ProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /{proxy+}
      Target: !Sub integrations/${ProxyIntegration}

  RootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /
      Target: !Sub integrations/${RootIntegration}

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  # ── Containers (the ECS cluster itself is in motormate-base) ────────────────────
  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: motormate-backend
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !Ref LabRoleArn
      TaskRoleArn: !Ref LabRoleArn
      ContainerDefinitions:
        - Name: backend
          Image: !Ref BackendImage
          Essential: true
          PortMappings: [{ ContainerPort: 8080 }]
          Environment:
            - Name: DATABASE_URL
              Value: !Sub
                - "postgresql://motormate:${DbPassword}@${DbHost}:5432/motormate?schema=public"
                - DbHost: !ImportValue motormate-DbHost
            # RDS requires SSL; the image carries AWS's RDS certificate bundle.
            - { Name: DATABASE_SSL_CA, Value: /app/rds-global-bundle.pem }
            - { Name: JWT_SECRET, Value: !Ref JwtSecret }
            - { Name: INVOICE_BUCKET, Value: !ImportValue motormate-InvoiceBucket }
            - { Name: CORS_ORIGIN, Value: !GetAtt HttpApi.ApiEndpoint }
            - { Name: NOTIFY_TOPIC_ARN, Value: !ImportValue motormate-NotifyTopic }
            - { Name: JOB_TOKEN, Value: !Ref JobToken }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /motormate/backend
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: motormate-frontend
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !Ref LabRoleArn
      TaskRoleArn: !Ref LabRoleArn
      ContainerDefinitions:
        - Name: frontend
          Image: !Ref FrontendImage
          Essential: true
          PortMappings: [{ ContainerPort: 3000 }]
          Environment:
            - { Name: NEXTAUTH_URL, Value: !GetAtt HttpApi.ApiEndpoint }
            - { Name: NEXTAUTH_SECRET, Value: !Ref NextAuthSecret }
            - { Name: API_INTERNAL_URL, Value: !Sub "http://${LoadBalancer.DNSName}/v1" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /motormate/frontend
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend

  BackendService:
    Type: AWS::ECS::Service
    DependsOn: BackendRule
    Properties:
      ServiceName: backend
      Cluster: !ImportValue motormate-Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref BackendTaskDefinition
      DesiredCount: !Ref BackendCount
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [",", !ImportValue motormate-PublicSubnets]
          SecurityGroups: [!ImportValue motormate-BackendSecurityGroup]
      LoadBalancers:
        - { ContainerName: backend, ContainerPort: 8080, TargetGroupArn: !Ref BackendTargetGroup }

  FrontendService:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: frontend
      Cluster: !ImportValue motormate-Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref FrontendTaskDefinition
      DesiredCount: !Ref FrontendCount
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [",", !ImportValue motormate-PublicSubnets]
          SecurityGroups: [!ImportValue motormate-FrontendSecurityGroup]
      LoadBalancers:
        - { ContainerName: frontend, ContainerPort: 3000, TargetGroupArn: !Ref FrontendTargetGroup }

  # ── Daily jobs ───────────────────────────────────────────────────────────────
  # The jobs live in the API (POST /v1/jobs/morning and /v1/jobs/close-day); this Lambda only
  # calls them with the job token, and fails on an error status so Scheduler retries.
  JobsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: motormate-daily-jobs
      Description: Calls MotorMate's daily jobs (service reminders, closing the shop day)
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !Ref LabRoleArn
      Timeout: 60
      MemorySize: 128
      Environment:
        Variables:
          JOBS_URL: !Sub "${HttpApi.ApiEndpoint}/v1/jobs"
          JOB_TOKEN: !Ref JobToken
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            const job = event && event.job;
            if (job !== "morning" && job !== "close-day") throw new Error("Unknown job: " + JSON.stringify(event));
            const response = await fetch(process.env.JOBS_URL + "/" + job, {
              method: "POST",
              headers: { "x-job-token": process.env.JOB_TOKEN },
              signal: AbortSignal.timeout(29000),
            });
            const body = await response.text();
            console.log(job, response.status, body);
            if (!response.ok) throw new Error(job + " failed with " + response.status);
            return JSON.parse(body);
          };

  # Every day, in Bangkok time. The jobs only act on shop days, so Sundays are harmless.
  MorningSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: motormate-morning
      Description: Service reminder emails and tomorrow's appointment reminders
      ScheduleExpression: cron(0 9 * * ? *)
      ScheduleExpressionTimezone: Asia/Bangkok
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt JobsFunction.Arn
        RoleArn: !Ref LabRoleArn
        Input: '{"job":"morning"}'
        RetryPolicy: { MaximumRetryAttempts: 2 }

  CloseDaySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: motormate-close-day
      Description: Marks the day's no-shows and cancels requests that were never confirmed
      ScheduleExpression: cron(30 18 * * ? *)
      ScheduleExpressionTimezone: Asia/Bangkok
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt JobsFunction.Arn
        RoleArn: !Ref LabRoleArn
        Input: '{"job":"close-day"}'
        RetryPolicy: { MaximumRetryAttempts: 2 }

Outputs:
  SiteUrl:
    Description: the HTTPS address of the whole site
    Value: !GetAtt HttpApi.ApiEndpoint
  LoadBalancerUrl:
    Description: plain-HTTP fallback (dev only)
    Value: !Sub "http://${LoadBalancer.DNSName}"
  ClusterName:
    Value: !ImportValue motormate-Cluster
